<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-labelledby="title desc">
  <title id="title">Contribution line metrics placeholder</title>
  <desc id="desc">This placeholder is shown until the GitHub Actions metrics workflow generates the contribution lines card.</desc>
  <style>
    .card {
      fill: #ffffff;
      stroke: #d0d7de;
    }
    .title {
      fill: #24292f;
      font: 600 28px 'Segoe UI', Arial, sans-serif;
    }
    .copy {
      fill: #57606a;
      font: 400 18px 'Segoe UI', Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .card {
        fill: #0d1117;
        stroke: #30363d;
      }
      .title {
        fill: #f0f6fc;
      }
      .copy {
        fill: #8b949e;
      }
    }
  </style>
  <rect class="card" x="1" y="1" width="858" height="178" rx="16" />
  <text class="title" x="430" y="78" text-anchor="middle">Contribution Line Metrics</text>
  <text class="copy" x="430" y="112" text-anchor="middle">This card will be generated automatically after the Metrics workflow runs.</text>
</svg>
