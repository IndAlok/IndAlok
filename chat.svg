    <text x="15" y="27">I&apos;m obsessed with scaling code and securing it.</text>
  </g>

  <g transform="translate(10, 144)" class="typing-4">
    <rect x="8" width="70" height="42" rx="21" class="bubble" />
    <circle cx="14" cy="33" r="8" class="bubble" />
    <circle cx="4" cy="42" r="4" class="bubble" />
    <circle cx="27" cy="21" r="5" fill="#999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" /></circle>
    <circle cx="43" cy="21" r="5" fill="#999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" /></circle>
    <circle cx="58" cy="21" r="5" fill="#999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
  </g>

  <g transform="translate(10, 144)" class="msg-4">
    <rect width="430" height="42" rx="18" class="bubble" />
    <text x="15" y="27">Let&apos;s build: <a xlink:href="https://telegram.me/IndAlok">Telegram</a> or <a xlink:href="mailto:alok16022006@gmail.com">Email</a></text>
  </g>
</svg>
