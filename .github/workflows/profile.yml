name: Update profile

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true
          options: >-
            username=IndAlok&show_icons=true&theme=transparent&hide_border=true&include_all_commits=true&show=reviews,prs_merged,prs_merged_percentage&custom_title=GitHub%20Snapshot&title_color=34d399&icon_color=34d399&text_color=8b949e&ring_color=34d399

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true
          options: >-
            username=IndAlok&layout=compact&langs_count=8&hide=html,css&theme=transparent&hide_border=true&title_color=34d399&text_color=8b949e

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          path: profile/streak.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          options: >-
            user=IndAlok&theme=transparent&hide_border=true&ring=34d399&fire=34d399&currStreakNum=34d399&sideNums=8b949e&currStreakLabel=34d399&sideLabels=8b949e&dates=6e7681

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/languages.svg profile/streak.svg
          git commit -m "chore: refresh profile cards" || exit 0
          git push

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: IndAlok
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
